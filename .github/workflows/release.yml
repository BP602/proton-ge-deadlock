name: Release

# Builds the Wine and lsteamclient parts of GloriousEggroll/proton-ge-custom with the patches in
# this repo, swaps them into GE's official release and publishes <GE tag>-deadlock.tar.gz
# (+ .sha512sum) as a GitHub release: one top-level directory named after the release, the
# layout ProtonPlus and manual installs expect.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      ge_tag:
        description: 'GE-Proton tag to build, e.g. GE-Proton11-14 (empty = latest GE release)'
        required: false
        type: string

# Read-only by default: the build job runs GE's build system, its submodules and a third-party
# action. Only the jobs that publish or file issues get write access.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GE_REPO: GloriousEggroll/proton-ge-custom

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      ge_tag: ${{ steps.plan.outputs.ge_tag }}
      name: ${{ steps.plan.outputs.name }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Pick GE tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.ge_tag }}
        run: |
          ge_tag="$INPUT_TAG"
          [ -n "$ge_tag" ] || ge_tag=$(gh api "repos/$GE_REPO/releases/latest" --jq .tag_name)
          [[ "$ge_tag" =~ ^GE-Proton[0-9]+-[0-9]+$ ]] || { echo "::error::unexpected GE tag '$ge_tag'"; exit 1; }
          name="$ge_tag-deadlock"
          build=true
          if gh release view "$name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$name already released (delete the release to rebuild)"
            build=false
          fi
          # A failed build opens an issue (job "Report failure"); hourly runs leave that tag alone
          # until the issue is closed, a manual dispatch always retries.
          title="$name failed to build"
          if [ "$build" = true ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json title --jq '.[].title')
            if grep -qxF -- "$title" <<< "$open"; then
              echo "::notice::'$title' is open; skipping (close it or dispatch the workflow to retry)"
              build=false
            fi
          fi
          {
            echo "ge_tag=$ge_tag"
            echo "name=$name"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.plan.outputs.name }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      DEADLOCK_STATE: ${{ github.workspace }}/.deadlock-state
    steps:
      - name: Cleanup disk space
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3.2.2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: |
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable
            postgresql* mysql* php* temurin-* *llvm* clang* mono-devel powershell dotnet-sdk-*
          remove_folders: |
            /usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia*
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/az*
            /usr/local/.ghcup

      - name: Prepare host
        run: sudo apt update && sudo apt-get install -y binutils-mingw-w64-x86-64 binutils-mingw-w64-i686

      - name: Checkout overlay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: overlay
          persist-credentials: false

      - name: Checkout ${{ needs.plan.outputs.ge_tag }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ env.GE_REPO }}
          ref: refs/tags/${{ needs.plan.outputs.ge_tag }}
          path: ge
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Patch
        working-directory: ge
        run: |
          git submodule update --init --filter=tree:0 --recursive
          ../overlay/scripts/apply-overlay.sh .
          # GE's CI ignores protonprep's exit status, so ../overlay/scripts/apply-overlay.sh verify checks
          # that our hooks ran instead.
          ./patches/protonprep-valve-staging.sh || true
          ../overlay/scripts/apply-overlay.sh verify
          # strip binaries at compile time to save space in the runner
          patch -Np1 -i ./.github/patches/0001-build-strip-binaries-early.patch
          ../overlay/scripts/slim-makefile.sh .
          mkdir ./build

      - name: Configure
        working-directory: ge/build
        run: ../configure.sh --build-name=${{ needs.plan.outputs.name }} --container-engine=docker

      - name: Make lsteamclient (builds wine first)
        working-directory: ge/build
        # One goal only: lsteamclient depends on wine. Each make invocation re-syncs the sources and
        # strips their generated autotools files, so a second invocation tries to rebuild xz and
        # libpcap and fails in the container; two goals at once race on the shared build tree.
        run: make -j$(nproc) lsteamclient

      - name: Build outputs
        if: always()
        working-directory: ge/build
        run: find . -type f \( -name ntdll.so -o -name ntdll.dll -o -name lsteamclient.dll -o -name wineserver \) -path '*dst-*' -printf '%s %p\n' | sort -k2

      - name: Assemble ${{ needs.plan.outputs.name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: overlay/scripts/make-tarball.sh ge ${{ needs.plan.outputs.ge_tag }} out

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ needs.plan.outputs.name }}
          retention-days: 1
          path: |
            out/${{ needs.plan.outputs.name }}.tar.gz
            out/${{ needs.plan.outputs.name }}.sha512sum

      - name: Upload built files for debugging
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: built-files
          retention-days: 1
          path: |
            ge/build/dst-*/bin/wineserver
            ge/build/dst-*/lib/wine/*/ntdll.*
            ge/build/**/lsteamclient.dll

  report:
    name: Report failure
    needs: [plan, build]
    if: failure() && needs.build.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.plan.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="$NAME failed to build"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
            --jq "[.[] | select(.title == \"$title\") | .number][0] // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$(printf '%s\n\n%s\n' \
              "Build failed: $RUN_URL" \
              "Hourly runs skip this tag while this issue is open. Fix the patches, then dispatch the workflow (or close this issue to let the next hourly run retry).")"
          fi

  release:
    name: Release ${{ needs.plan.outputs.name }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ needs.plan.outputs.name }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.plan.outputs.name }}
          GE_TAG: ${{ needs.plan.outputs.ge_tag }}
        run: |
          if gh release view "$NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $NAME already exists; delete it first to rebuild"
            exit 1
          fi
          gh release create "$NAME" "$NAME.tar.gz" "$NAME.sha512sum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "$NAME" \
            --notes "$GE_TAG (https://github.com/$GE_REPO/releases/tag/$GE_TAG) with ntdll, wineserver and lsteamclient rebuilt from the patches in this repository at $GITHUB_SHA; everything else is GE's official release. See the README for what they change and how to enable them."

      - name: Close failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          title="$NAME failed to build"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" |
          while read -r num; do
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Released as $NAME."
          done
